version: 2
project_name: wick
before:
  hooks:
    - mkdir -p {{ .Env.PROJECT_ROOT }}/src/internal/assets
    - cp LICENSE {{ .Env.PROJECT_ROOT }}/src/internal/assets/LICENSE

builds:
  - id: darwin-arm64
    main: ./src/cmd/wick
    binary: wick
    goos: [darwin]
    goarch: [arm64]
    tags: [byollvm, llvm20]
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++
      - CGO_CFLAGS=-I{{ .Env.PROJECT_ROOT }}/src/internal/llvm/toolchain/include/darwin_arm64
      - CGO_CXXFLAGS=-I{{ .Env.PROJECT_ROOT }}/src/internal/llvm/toolchain/include/darwin_arm64 -std=c++17
      - CGO_LDFLAGS={{ .Env.LLVM_LDFLAGS_DARWIN_ARM64 }}
    ldflags:
      - "-s -w"
      - "-X main.version={{ .Version }}"

archives:
  - id: darwin-archives
    ids:
      - darwin-arm64
    formats:
      - tar.gz
    files:
      - LICENSE

snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^docs:"
      - "^test:"
