name: Test Wick
on: # Must succeed before merging pull to master
  pull_request:
    branches:
      - master
    paths:
      - "src/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Pull Forgejo
        run: |
          git lfs pull

      - name: Install make
        run: |
          sudo apt install make

      - uses: actions/setup-go@v4
        with:
          go-version: 1.26

      - name: Run tests
        run: |
          make test
