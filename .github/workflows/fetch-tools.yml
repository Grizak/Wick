name: Fetch Tools

on:
  workflow_dispatch:

concurrency:
  group: fetch-tools
  cancel-in-progress: true

env:
  LLVM_VERSION: "20.1.8"

jobs:
  fetch-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            musl_target: x86_64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-amd64-tools
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            musl_target: aarch64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-arm64-tools
          - os: macos-15
            platform: darwin_arm64
            lld_binary: ld64.lld
            artifact_name: darwin-arm64-tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: |
          rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/lib/${{ matrix.platform }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            xz-utils \
            patch \
            perl \
            zlib1g-dev

      - name: Build musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 \
            https://github.com/richfelker/musl-cross-make.git

          make -C musl-cross-make \
            TARGET="${{ matrix.musl_target }}" \
            OUTPUT="$RUNNER_TEMP/musl-toolchain" \
            -j"$(nproc)" \
            install

          TOOLCHAIN="$RUNNER_TEMP/musl-toolchain/bin"

          "$TOOLCHAIN/${{ matrix.musl_target }}-gcc" --version
          "$TOOLCHAIN/${{ matrix.musl_target }}-g++" --version

          echo "MUSL_CC=$TOOLCHAIN/${{ matrix.musl_target }}-gcc" >> "$GITHUB_ENV"
          echo "MUSL_CXX=$TOOLCHAIN/${{ matrix.musl_target }}-g++" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Get LLVM version
        id: llvm-version
        run: |
          echo "version=${{ env.LLVM_VERSION }}" >> $GITHUB_OUTPUT

      - name: Clone LLVM
        run: |
          git clone --depth 1 \
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
            https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-${{ matrix.platform }}-${{ steps.llvm-version.outputs.version }}-musl

      - name: Build LLVM libraries and lld (Linux)
        if: runner.os == 'Linux'
        run: |
          cd llvm-project

          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER="$MUSL_CC" \
            -DCMAKE_CXX_COMPILER="$MUSL_CXX" \
            -DLLVM_HOST_TRIPLE="${{ matrix.musl_target }}" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

          ninja -C build lld LLVMExecutionEngine LLVMInterpreter LLVMRuntimeDyld LLVMMCJIT

      - name: Verify musl outputs (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          BIN="src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}"
          LIB="src/internal/llvm/toolchain/lib/${{ matrix.platform }}"

          echo "Checking lld..."
          file "$BIN"
          readelf -l "$BIN" | grep INTERP && {
            echo "ERROR: lld has a dynamic interpreter"
            exit 1
          } || true

          echo "Checking for glibc-specific symbol..."
          if nm -A -u "$LIB"/*.a | grep '__libc_single_threaded'; then
            echo "ERROR: glibc-specific references remain"
            exit 1
          fi

          echo "Checking dynamic dependencies..."
          if readelf -d "$BIN" | grep NEEDED; then
            echo "ERROR: lld has dynamic dependencies"
            exit 1
          fi

          echo "Musl verification passed!"

      - name: Build LLVM libraries and lld (macOS)
        if: runner.os == 'macOS'
        run: |
          cd llvm-project
          # -DCMAKE_EXE_LINKER_FLAGS="-static" is intentionally omitted:
          # Apple does not ship static versions of system libraries, so
          # requesting a fully static link fails on Darwin. LLVM_BUILD_STATIC
          # still statically links LLVM's own internals.
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja -C build lld LLVMExecutionEngine LLVMInterpreter LLVMMCJIT

      - name: Copy headers
        run: |
          OUT="src/internal/llvm/toolchain"
          PLATFORM="${{ matrix.platform }}"

          mkdir -p "$OUT/include/$PLATFORM/llvm" \
                  "$OUT/include/$PLATFORM/llvm-c"

          cp -R llvm-project/llvm/include/llvm/. \
            "$OUT/include/$PLATFORM/llvm/"
          cp -R llvm-project/llvm/include/llvm-c/. \
            "$OUT/include/$PLATFORM/llvm-c/"

          # Include generated config headers, if present.
          if [ -d llvm-project/build/include/llvm ]; then
            cp -R llvm-project/build/include/llvm/. \
              "$OUT/include/$PLATFORM/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for lib in llvm-project/build/lib/*.a; do
            cp "$lib" "$OUT/"
          done

          ls -l "$OUT"

      - name: Prepare binaries
        run: |
          BIN=src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          mkdir -p "$BIN"
          cp llvm-project/build/bin/${{ matrix.lld_binary }} "$BIN/${{ matrix.lld_binary }}"
          chmod +x "$BIN"/*

      - name: Verify outputs
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          test -f src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}
          test -n "$(ls "$OUT"/*.a 2>/dev/null)" || { echo "No archives copied"; exit 1; }

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: strip src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: strip -x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Write versions
        run: |
          BIN=src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          LLD_VERSION=$($BIN/${{ matrix.lld_binary }} --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "{\"lld\": \"$LLD_VERSION\"}" > $BIN/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src/internal/llvm/toolchain/bin/${{ matrix.platform }}/
            src/internal/llvm/toolchain/lib/${{ matrix.platform }}/
            src/internal/llvm/toolchain/include/${{ matrix.platform }}/

  fetch-windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-binutils

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/windows_amd64 src/internal/llvm/toolchain/lib/windows_amd64

      - name: Clone LLVM
        run: |
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-windows-amd64-mingw-${{ env.LLVM_VERSION }}

      - name: Build LLVM libraries and lld
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          cmake --build llvm-project/build

      - name: Copy headers
        run: |
          root=src/internal/llvm/toolchain/include/windows_amd64
          mkdir -p "$root/llvm" "$root/llvm-c"
          cp -r llvm-project/llvm/include/llvm/. "$root/llvm/"
          cp -r llvm-project/llvm/include/llvm-c/. "$root/llvm-c/"
          if [ -d llvm-project/build/include/llvm ]; then
            cp -r llvm-project/build/include/llvm/. "$root/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_amd64
          rm -rf "$out"
          mkdir -p "$out"

          shopt -s nullglob
          libs=(llvm-project/build/lib/*.a)
          echo "Found ${#libs[@]} archives in llvm-project/build/lib"
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "Build produced no .a files. Listing lib directory:"
            ls -la llvm-project/build/lib || true
            exit 1
          fi

          copied=0
          for lib in "${libs[@]}"; do
            case "$lib" in
              *.dll.a) continue ;;
            esac
            cp "$lib" "$out/"
            copied=$((copied + 1))
          done
          echo "Copied $copied archives into $out"
          ls -la "$out"

      - name: Prepare binaries
        run: |
          out=src/internal/llvm/toolchain/bin/windows_amd64
          mkdir -p "$out"

          cp llvm-project/build/bin/lld-link.exe "$out/"

          # Windows SDK version folders look like 10.0.26100.0
          sdk_lib="/c/Program Files (x86)/Windows Kits/10/Lib"
          sdk=$(ls -d "$sdk_lib"/[0-9]*.[0-9]*.[0-9]*.[0-9]*/ 2>/dev/null | sort -V | tail -n1)

          if [ -z "$sdk" ] || [ ! -f "${sdk}um/x64/kernel32.lib" ]; then
            echo "No x64 kernel32.lib found in any SDK version under $sdk_lib"
            ls "$sdk_lib"
            exit 1
          fi

          echo "Using SDK ${sdk}"
          cp "${sdk}um/x64/kernel32.lib" "$out/kernel32.lib"

      - name: Verify outputs
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_amd64
          test -f src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe
          archives=$(find "$out" -maxdepth 1 -name '*.a' 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "No archives found in $out"
            ls -la "$out" || true
            exit 1
          fi

      - name: Strip binaries
        run: strip src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe

      - name: Write versions
        run: |
          bin=src/internal/llvm/toolchain/bin/windows_amd64
          lld=$("$bin/lld-link.exe" --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)
          printf '{"lld":"%s"}\n' "$lld" > "$bin/versions.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64-tools
          if-no-files-found: error
          path: |
            src/internal/llvm/toolchain/bin/windows_amd64/
            src/internal/llvm/toolchain/lib/windows_amd64/
            src/internal/llvm/toolchain/include/windows_amd64/

  fetch-windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-binutils
            mingw-w64-clang-aarch64-python

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/windows_arm64 src/internal/llvm/toolchain/lib/windows_arm64

      - name: Clone LLVM
        run: |
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-windows-arm64-mingw-${{ env.LLVM_VERSION }}

      - name: Build LLVM libraries and lld
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          cmake --build llvm-project/build

      - name: Copy headers
        run: |
          root=src/internal/llvm/toolchain/include/windows_arm64
          mkdir -p "$root/llvm" "$root/llvm-c"
          cp -r llvm-project/llvm/include/llvm/. "$root/llvm/"
          cp -r llvm-project/llvm/include/llvm-c/. "$root/llvm-c/"
          if [ -d llvm-project/build/include/llvm ]; then
            cp -r llvm-project/build/include/llvm/. "$root/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_arm64
          rm -rf "$out"
          mkdir -p "$out"

          shopt -s nullglob
          libs=(llvm-project/build/lib/*.a)
          echo "Found ${#libs[@]} archives in llvm-project/build/lib"
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "Build produced no .a files. Listing lib directory:"
            ls -la llvm-project/build/lib || true
            exit 1
          fi

          copied=0
          for lib in "${libs[@]}"; do
            case "$lib" in
              *.dll.a) continue ;;
            esac
            cp "$lib" "$out/"
            copied=$((copied + 1))
          done
          echo "Copied $copied archives into $out"
          ls -la "$out"

      - name: Prepare binaries
        run: |
          out=src/internal/llvm/toolchain/bin/windows_arm64
          mkdir -p "$out"

          cp llvm-project/build/bin/lld-link.exe "$out/"

          # Windows SDK version folders look like 10.0.26100.0
          sdk_lib="/c/Program Files (x86)/Windows Kits/10/Lib"
          sdk=$(ls -d "$sdk_lib"/[0-9]*.[0-9]*.[0-9]*.[0-9]*/ 2>/dev/null | sort -V | tail -n1)

          if [ -z "$sdk" ] || [ ! -f "${sdk}um/arm64/kernel32.lib" ]; then
            echo "No ARM64 kernel32.lib found in any SDK version under $sdk_lib"
            ls "$sdk_lib"
            exit 1
          fi

          echo "Using SDK ${sdk}"
          cp "${sdk}um/arm64/kernel32.lib" "$out/kernel32.lib"

      - name: Verify outputs
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_arm64
          test -f src/internal/llvm/toolchain/bin/windows_arm64/lld-link.exe
          archives=$(find "$out" -maxdepth 1 -name '*.a' 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "No archives found in $out"
            ls -la "$out" || true
            exit 1
          fi

      - name: Strip binaries
        run: strip src/internal/llvm/toolchain/bin/windows_arm64/lld-link.exe

      - name: Write versions
        run: |
          bin=src/internal/llvm/toolchain/bin/windows_arm64
          lld=$("$bin/lld-link.exe" --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)
          printf '{"lld":"%s"}\n' "$lld" > "$bin/versions.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-tools
          if-no-files-found: error
          path: |
            src/internal/llvm/toolchain/bin/windows_arm64/
            src/internal/llvm/toolchain/lib/windows_arm64/
            src/internal/llvm/toolchain/include/windows_arm64/

  commit:
    needs: [fetch-unix, fetch-windows-amd64, fetch-windows-arm64]
    runs-on: [self-hosted, lfs-home]
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1" # don't download the old binaries; the artifacts replace them
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for the no-ff merge
          lfs: false

      - name: Configure Forgejo credentials for LFS
        run: |
          umask 077
          printf 'machine git.isaksweb.xyz\nlogin %s\npassword %s\n' \
            "${{ vars.FORGEJO_USER }}" "${{ secrets.FORGEJO_TOKEN }}" > "$HOME/.netrc"

      - name: Setup git
        run: |
          git config credential.helper "netrc -f ~/.netrc"
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git checkout -B chore/update-tools

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-arm64-tools
          path: src/internal/llvm/toolchain/

      - name: Commit and push
        run: |
          set -e
          git add src/internal/llvm/toolchain/
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi
          git commit -m "chore: update tools"
          git checkout dev
          git pull --no-rebase origin dev
          git merge --no-ff chore/update-tools
          git push origin dev

      - name: Remove Forgejo credentials
        if: always()
        run: rm -f "$HOME/.netrc"
