name: Fetch Tools

on:
  workflow_dispatch:

concurrency:
  group: fetch-tools
  cancel-in-progress: true

env:
  LLVM_VERSION: "20.1.8"

jobs:
  fetch-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            lld_binary: ld.lld
            artifact_name: linux-amd64-tools
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            lld_binary: ld.lld
            artifact_name: linux-arm64-tools
          - os: macos-15
            platform: darwin_arm64
            lld_binary: ld64.lld
            artifact_name: darwin-arm64-tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: |
          rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/lib/${{ matrix.platform }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Get LLVM version
        id: llvm-version
        run: |
          echo "version=${{ env.LLVM_VERSION }}" >> $GITHUB_OUTPUT

      - name: Clone LLVM
        run: |
          git clone --depth 1 \
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
            https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-${{ matrix.platform }}-${{ steps.llvm-version.outputs.version }}

      - name: Build LLVM libraries and lld (Linux)
        if: runner.os == 'Linux'
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          ninja -C build lld

      - name: Build LLVM libraries and lld (macOS)
        if: runner.os == 'macOS'
        run: |
          cd llvm-project
          # -DCMAKE_EXE_LINKER_FLAGS="-static" is intentionally omitted:
          # Apple does not ship static versions of system libraries, so
          # requesting a fully static link fails on Darwin. LLVM_BUILD_STATIC
          # still statically links LLVM's own internals.
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja -C build lld

      - name: Create static LLVM archive (Linux)
        if: runner.os == 'Linux'
        run: |
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          mkdir -p "$OUT"
          {
            echo "CREATE $OUT/libLLVM.a"
            for f in llvm-project/build/lib/*.a; do echo "ADDLIB $f"; done
            echo "SAVE"
            echo "END"
          } | ar -M
          ranlib "$OUT/libLLVM.a"

      - name: Create static LLVM archive (macOS)
        if: runner.os == 'macOS'
        run: |
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          mkdir -p "$OUT"
          libtool -static -o "$OUT/libLLVM.a" llvm-project/build/lib/*.a

      - name: Prepare binaries
        run: |
          BIN=src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          mkdir -p "$BIN"
          cp llvm-project/build/bin/${{ matrix.lld_binary }} "$BIN/${{ matrix.lld_binary }}"
          chmod +x "$BIN"/*

      - name: Verify outputs
        run: |
          test -f src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}
          test -s src/internal/llvm/toolchain/lib/${{ matrix.platform }}/libLLVM.a

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: strip src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: strip -x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Write versions
        run: |
          BIN=src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          LLD_VERSION=$($BIN/${{ matrix.lld_binary }} --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "{\"lld\": \"$LLD_VERSION\"}" > $BIN/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src/internal/llvm/toolchain/bin/${{ matrix.platform }}/
            src/internal/llvm/toolchain/lib/${{ matrix.platform }}/

  fetch-windows-amd64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            src/internal/llvm/toolchain/bin/windows_amd64, `
            src/internal/llvm/toolchain/lib/windows_amd64

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y

          $llvmBin = "C:\Program Files\LLVM\bin"
          echo "$llvmBin" >> $env:GITHUB_PATH

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Get LLVM version
        id: llvm-version
        shell: pwsh
        env:
          LLVM_VERSION: ${{ env.LLVM_VERSION }}
        run: |
          "version=${{ env.LLVM_VERSION }}" >> $env:GITHUB_OUTPUT

      - name: Clone LLVM
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} `
            https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-windows-amd64-${{ steps.llvm-version.outputs.version }}

      - name: Build LLVM libraries and lld
        shell: pwsh
        run: |
          cmake `
            -S llvm-project/llvm `
            -B llvm-project/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_ASM_COMPILER=clang `
            -DLLVM_BUILD_STATIC=ON `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" `
            -DLLVM_ENABLE_PROJECTS="lld" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF

          cmake --build llvm-project/build

      - name: Create static LLVM archive
        shell: pwsh
        run: |
          $out = "src/internal/llvm/toolchain/lib/windows_amd64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $libs = Get-ChildItem llvm-project/build/lib/*.lib | ForEach-Object { $_.FullName }
          llvm-lib /OUT:"$out\LLVM.lib" $libs

      - name: Prepare binaries
        shell: pwsh
        run: |
          $out = "src/internal/llvm/toolchain/bin/windows_amd64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item llvm-project/build/bin/lld-link.exe $out

      - name: Copy kernel32.lib
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
            Sort-Object Name -Descending |
            Select-Object -First 1

          Copy-Item `
            "$($sdk.FullName)\um\x64\kernel32.lib" `
            src/internal/llvm/toolchain/bin/windows_amd64/kernel32.lib

      - name: Verify outputs
        shell: pwsh
        run: |
          Test-Path src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe
          Test-Path src/internal/llvm/toolchain/lib/windows_amd64/LLVM.lib

      - name: Strip binaries
        shell: pwsh
        run: llvm-strip src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe

      - name: Write versions
        shell: pwsh
        run: |
          $bin = "src/internal/llvm/toolchain/bin/windows_amd64"

          $lld = (& "$bin\lld-link.exe" --version |
            Select-String '\d+\.\d+(\.\d+)?').Matches[0].Value

          @{
            lld = $lld
          } | ConvertTo-Json -Compress |
            Set-Content "$bin\versions.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64-tools
          path: |
            src/internal/llvm/toolchain/bin/windows_amd64/
            src/internal/llvm/toolchain/lib/windows_amd64/

  fetch-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            src/internal/llvm/toolchain/bin/windows_arm64, `
            src/internal/llvm/toolchain/lib/windows_arm64

      # Native ARM64 MSVC environment. The Chocolatey LLVM package is x64
      # only, so the LLVM build itself uses cl.exe rather than clang.
      - name: Setup MSVC (ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # llvm-lib and llvm-strip are host-independent tools; the x64 build
      # runs under emulation on Windows ARM and only handles archiving here.
      - name: Install tools
        shell: pwsh
        run: |
          choco install llvm cmake ninja -y

          $llvmBin = "C:\Program Files\LLVM\bin"
          echo "$llvmBin" >> $env:GITHUB_PATH

      - name: Get LLVM version
        id: llvm-version
        shell: pwsh
        env:
          LLVM_VERSION: ${{ env.LLVM_VERSION }}
        run: |
          "version=${{ env.LLVM_VERSION }}" >> $env:GITHUB_OUTPUT

      - name: Clone LLVM
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} `
            https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-windows_arm64-${{ steps.llvm-version.outputs.version }}

      - name: Build LLVM libraries and lld
        shell: pwsh
        run: |
          cmake `
            -S llvm-project/llvm `
            -B llvm-project/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DLLVM_BUILD_STATIC=ON `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" `
            -DLLVM_ENABLE_PROJECTS="lld" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF

          cmake --build llvm-project/build

      - name: Create static LLVM archive
        shell: pwsh
        run: |
          $out = "src/internal/llvm/toolchain/lib/windows_arm64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $libs = Get-ChildItem llvm-project/build/lib/*.lib | ForEach-Object { $_.FullName }
          llvm-lib /OUT:"$out\LLVM.lib" $libs

      - name: Prepare binaries
        shell: pwsh
        run: |
          $out = "src/internal/llvm/toolchain/bin/windows_arm64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item llvm-project/build/bin/lld-link.exe $out

      - name: Copy kernel32.lib
        shell: pwsh
        run: |
          $libRoot = "C:\Program Files (x86)\Windows Kits\10\Lib"

          $kernel32 = Get-ChildItem $libRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object {
              $candidate = Join-Path $_.FullName "um\arm64\kernel32.lib"
              if (Test-Path $candidate) { $candidate; break }
            }

          if (-not $kernel32) {
            throw "No ARM64 kernel32.lib found under $libRoot"
          }

          Copy-Item $kernel32 `
            "src/internal/llvm/toolchain/bin/windows_arm64/kernel32.lib"

      - name: Verify outputs
        shell: pwsh
        run: |
          Test-Path src/internal/llvm/toolchain/bin/windows_arm64/lld-link.exe
          Test-Path src/internal/llvm/toolchain/lib/windows_arm64/LLVM.lib

      - name: Strip binaries
        shell: pwsh
        run: llvm-strip src/internal/llvm/toolchain/bin/windows_arm64/lld-link.exe

      - name: Write versions
        shell: pwsh
        run: |
          $bin = "src/internal/llvm/toolchain/bin/windows_arm64"

          $lld = (& "$bin\lld-link.exe" --version |
            Select-String '\d+\.\d+(\.\d+)?').Matches[0].Value

          @{
            lld = $lld
          } | ConvertTo-Json -Compress |
            Set-Content "$bin\versions.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-tools
          path: |
            src/internal/llvm/toolchain/bin/windows_arm64/
            src/internal/llvm/toolchain/lib/windows_arm64/

  commit:
    needs: [fetch-unix, fetch-windows-amd64, fetch-windows-arm64]
    runs-on: [self-hosted, lfs-home]
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1" # don't download the old binaries; the artifacts replace them
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for the no-ff merge
          lfs: false
<
      - name: Configure Forgejo credentials for LFS
        run: |
          umask 077
          printf 'machine git-lfs.isaksweb.xyz\nlogin %s\npassword %s\n' \
            "${{ secrets.FORGEJO_USER }}" "${{ secrets.FORGEJO_TOKEN }}" > "$HOME/.netrc"

      - name: Setup git
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git checkout -B chore/update-tools

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-arm64-tools
          path: src/internal/llvm/toolchain/

      - name: Commit and push
        run: |
          set -e
          git add src/internal/llvm/toolchain/
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi
          git commit -m "chore: update tools"
          git checkout master
          git pull --no-rebase origin master
          git merge --no-ff chore/update-tools
          git push origin master

      - name: Remove Forgejo credentials
        if: always()
        run: rm -f "$HOME/.netrc"
