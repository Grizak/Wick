name: Fetch Tools

on:
  workflow_dispatch:

env:
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://100.125.229.8:3900
  SCCACHE_REGION: garage
  SCCACHE_S3_USE_SSL: "off"
  AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  LLVM_VERSION: "20.1.8"

jobs:
  fetch-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            musl_target: x86_64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-amd64-tools
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            musl_target: aarch64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-arm64-tools
          - os: macos-15
            platform: darwin_arm64
            lld_binary: ld64.lld
            artifact_name: darwin-arm64-tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: |
          rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/lib/${{ matrix.platform }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            xz-utils \
            patch \
            perl \
            zlib1g-dev

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Start sccache
        run: sccache --start-server

      - name: Clone musl-cross-make (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 \
            --branch v0.9.11 \
            https://github.com/richfelker/musl-cross-make.git

      - name: Download GNU config.sub (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p musl-cross-make/sources

          curl --fail --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --output musl-cross-make/sources/config.sub \
            "https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=3d5db9ebe860"

          (
            cd musl-cross-make/sources
            sha1sum -c ../hashes/config.sub.3d5db9ebe860.sha1
          )

      - name: Configure musl-cross-make for static builds (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cat > musl-cross-make/config.mak <<'EOF'
          COMMON_CONFIG += CFLAGS="-g0 -O2" CXXFLAGS="-g0 -O2" LDFLAGS="-s -static"
          COMMON_CONFIG += CC="sccache gcc" CXX="sccache g++"
          EOF

      - name: Build musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          make -C musl-cross-make \
            TARGET="${{ matrix.musl_target }}" \
            OUTPUT="$RUNNER_TEMP/musl-toolchain" \
            -j"$(nproc)" \
            install

          TOOLCHAIN="$RUNNER_TEMP/musl-toolchain/bin"

          "$TOOLCHAIN/${{ matrix.musl_target }}-gcc" --version
          "$TOOLCHAIN/${{ matrix.musl_target }}-g++" --version

          echo "MUSL_CC=$TOOLCHAIN/${{ matrix.musl_target }}-gcc" >> "$GITHUB_ENV"
          echo "MUSL_CXX=$TOOLCHAIN/${{ matrix.musl_target }}-g++" >> "$GITHUB_ENV"

      - name: Generate musl toolchain metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TARGET="${{ matrix.musl_target }}"
          TOOLCHAIN="$RUNNER_TEMP/musl-toolchain/bin"

          # Read the effective versions from musl-cross-make.
          mapfile -t VERSIONS < <(
            make -s -C musl-cross-make \
              TARGET="$TARGET" \
              --eval='print-versions:;@printf "%s\n" "$(GCC_VER)" "$(MUSL_VER)" "$(BINUTILS_VER)" "$(GMP_VER)" "$(MPC_VER)" "$(MPFR_VER)" "$(ISL_VER)" "$(LINUX_VER)"' \
              print-versions
          )

          GCC_VER="${VERSIONS[0]}"
          MUSL_VER="${VERSIONS[1]}"
          BINUTILS_VER="${VERSIONS[2]}"
          GMP_VER="${VERSIONS[3]}"
          MPC_VER="${VERSIONS[4]}"
          MPFR_VER="${VERSIONS[5]}"
          ISL_VER="${VERSIONS[6]}"
          LINUX_VER="${VERSIONS[7]}"

          GCC_ACTUAL=$("$TOOLCHAIN/$TARGET-gcc" -dumpfullversion -dumpversion)
          BUILD_COMMIT=$(git -C musl-cross-make rev-parse HEAD)

          cat > "$RUNNER_TEMP/musl-toolchain/versions.json" <<EOF
          {
            "schema_version": 1,
            "target": "$TARGET",
            "builder": {
              "name": "musl-cross-make",
              "commit": "$BUILD_COMMIT"
            },
            "components": {
              "gcc": "$GCC_VER",
              "gcc_reported": "$GCC_ACTUAL",
              "musl": "$MUSL_VER",
              "binutils": "$BINUTILS_VER",
              "gmp": "$GMP_VER",
              "mpc": "$MPC_VER",
              "mpfr": "$MPFR_VER",
              "isl": "$ISL_VER",
              "linux_headers": "$LINUX_VER"
            }
          }
          EOF

          cat "$RUNNER_TEMP/musl-toolchain/versions.json"

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "toolchains/musl/${{ matrix.platform }}"
          cp -a "$RUNNER_TEMP/musl-toolchain/." \
            "toolchains/musl/${{ matrix.platform }}/"

      - name: Package musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf musl-toolchain.tar.gz \
            -C "$RUNNER_TEMP/musl-toolchain" .

      - name: Upload musl toolchain (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: musl-toolchain-${{ matrix.platform }}
          path: musl-toolchain.tar.gz

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Get LLVM version
        id: llvm-version
        run: |
          echo "version=${{ env.LLVM_VERSION }}" >> $GITHUB_OUTPUT

      - name: Clone LLVM
        run: |
          git clone --depth 1 \
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
            https://github.com/llvm/llvm-project.git

      - name: Build LLVM libraries and lld (Linux)
        if: runner.os == 'Linux'
        run: |
          cd llvm-project

          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER="$MUSL_CC" \
            -DCMAKE_CXX_COMPILER="$MUSL_CXX" \
            -DLLVM_HOST_TRIPLE="${{ matrix.musl_target }}" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections"

          ninja -C build LLVMExecutionEngine LLVMInterpreter LLVMRuntimeDyld LLVMMCJIT

      - name: Build LLVM libraries and lld (macOS)
        if: runner.os == 'macOS'
        run: |
          cd llvm-project
          # -DCMAKE_EXE_LINKER_FLAGS="-static" is intentionally omitted:
          # Apple does not ship static versions of system libraries, so
          # requesting a fully static link fails on Darwin. LLVM_BUILD_STATIC
          # still statically links LLVM's own internals.
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections"

          ninja -C build LLVMExecutionEngine LLVMInterpreter LLVMMCJIT

      - name: Copy headers
        run: |
          OUT="src/internal/llvm/toolchain"
          PLATFORM="${{ matrix.platform }}"

          mkdir -p "$OUT/include/$PLATFORM/llvm" \
                  "$OUT/include/$PLATFORM/llvm-c"

          cp -R llvm-project/llvm/include/llvm/. \
            "$OUT/include/$PLATFORM/llvm/"
          cp -R llvm-project/llvm/include/llvm-c/. \
            "$OUT/include/$PLATFORM/llvm-c/"
          cp -R llvm-project/lld/include/lld/. \
            "$OUT/include/$PLATFORM/lld/"

          for flavor in ELF COFF MachO; do
            mkdir -p "$OUT/include/$PLATFORM/lld/$flavor"
            cp -R "llvm-project/lld/$flavor/." \
              "$OUT/include/$PLATFORM/lld/$flavor/"
          done

          # Include generated config headers, if present.
          if [ -d llvm-project/build/include/llvm ]; then
            cp -R llvm-project/build/include/llvm/. \
              "$OUT/include/$PLATFORM/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for lib in llvm-project/build/lib/*.a; do
            cp "$lib" "$OUT/"
          done

      - name: Verify outputs
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          test -n "$(ls "$OUT"/*.a 2>/dev/null)" || { echo "No archives copied"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src/internal/llvm/toolchain/lib/${{ matrix.platform }}/
            src/internal/llvm/toolchain/include/${{ matrix.platform }}/

  fetch-windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            git
            mingw-w64-clang-x86_64-gcc
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-binutils
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sccache

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Start sccache
        run: sccache --start-server

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/windows_amd64 src/internal/llvm/toolchain/lib/windows_amd64

      - name: Clone LLVM
        run: |
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git

      - name: Build LLVM libraries and lld
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLD_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections"

          cmake --build llvm-project/build

      - name: Copy headers
        run: |
          root=src/internal/llvm/toolchain/include/windows_amd64
          mkdir -p "$root/llvm" "$root/llvm-c" "$root/lld"
          cp -r llvm-project/llvm/include/llvm/. "$root/llvm/"
          cp -r llvm-project/llvm/include/llvm-c/. "$root/llvm-c/"
          cp -r llvm-project/lld/include/lld/. "$root/lld/"
          for flavor in ELF COFF MachO; do
            mkdir -p "$root/include/$PLATFORM/lld/$flavor"
            cp -R "llvm-project/lld/$flavor/." \
              "$root/include/$PLATFORM/lld/$flavor/"
          done
          if [ -d llvm-project/build/include/llvm ]; then
            cp -r llvm-project/build/include/llvm/. "$root/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_amd64
          rm -rf "$out"
          mkdir -p "$out"

          shopt -s nullglob
          libs=(llvm-project/build/lib/*.a)
          echo "Found ${#libs[@]} archives in llvm-project/build/lib"
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "Build produced no .a files. Listing lib directory:"
            ls -la llvm-project/build/lib || true
            exit 1
          fi

          copied=0
          for lib in "${libs[@]}"; do
            case "$lib" in
              *.dll.a) continue ;;
            esac
            cp "$lib" "$out/"
            copied=$((copied + 1))
          done
          echo "Copied $copied archives into $out"
          ls -la "$out"

      - name: Copy kernel32.lib
        run: |
          out=src/internal/llvm/toolchain/libc/windows_amd64
          mkdir -p "$out"

          # Windows SDK version folders look like 10.0.26100.0
          sdk_lib="/c/Program Files (x86)/Windows Kits/10/Lib"
          sdk=$(ls -d "$sdk_lib"/[0-9]*.[0-9]*.[0-9]*.[0-9]*/ 2>/dev/null | sort -V | tail -n1)

          if [ -z "$sdk" ] || [ ! -f "${sdk}um/x64/kernel32.lib" ]; then
            echo "No x64 kernel32.lib found in any SDK version under $sdk_lib"
            ls "$sdk_lib"
            exit 1
          fi

          echo "Using SDK ${sdk}"
          cp "${sdk}um/x64/kernel32.lib" "$out/kernel32.lib"

      - name: Verify outputs
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_amd64
          archives=$(find "$out" -maxdepth 1 -name '*.a' 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "No archives found in $out"
            ls -la "$out" || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64-tools
          if-no-files-found: error
          path: |
            src/internal/llvm/toolchain/bin/windows_amd64/
            src/internal/llvm/toolchain/lib/windows_amd64/
            src/internal/llvm/toolchain/include/windows_amd64/

  fetch-windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-binutils
            mingw-w64-clang-aarch64-python
            mingw-w64-clang-aarch64-sccache

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Start sccache
        run: sccache --start-server

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/windows_arm64 src/internal/llvm/toolchain/lib/windows_arm64

      - name: Clone LLVM
        run: |
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git

      - name: Build LLVM libraries and lld
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DLLVM_USE_CRT_DEBUG=MT \
            -DLLVM_USE_CRT_MINSIZEREL=MT \
            -DLLVM_USE_CRT_RELEASE=MT \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLD_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections"

          cmake --build llvm-project/build

      - name: Copy headers
        run: |
          root=src/internal/llvm/toolchain/include/windows_arm64
          mkdir -p "$root/llvm" "$root/llvm-c" "$root/lld"
          cp -r llvm-project/llvm/include/llvm/. "$root/llvm/"
          cp -r llvm-project/llvm/include/llvm-c/. "$root/llvm-c/"
          cp -r llvm-project/lld/include/lld/. "$root/lld/"
          for flavor in ELF COFF MachO; do
            mkdir -p "$root/include/$PLATFORM/lld/$flavor"
            cp -R "llvm-project/lld/$flavor/." \
              "$root/include/$PLATFORM/lld/$flavor/"
          done
          if [ -d llvm-project/build/include/llvm ]; then
            cp -r llvm-project/build/include/llvm/. "$root/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_arm64
          rm -rf "$out"
          mkdir -p "$out"

          shopt -s nullglob
          libs=(llvm-project/build/lib/*.a)
          echo "Found ${#libs[@]} archives in llvm-project/build/lib"
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "Build produced no .a files. Listing lib directory:"
            ls -la llvm-project/build/lib || true
            exit 1
          fi

          copied=0
          for lib in "${libs[@]}"; do
            case "$lib" in
              *.dll.a) continue ;;
            esac
            cp "$lib" "$out/"
            copied=$((copied + 1))
          done
          echo "Copied $copied archives into $out"
          ls -la "$out"

      - name: Copy kernel32.lib
        run: |
          out=src/internal/llvm/toolchain/libc/windows_arm64
          mkdir -p "$out"

          # Windows SDK version folders look like 10.0.26100.0
          sdk_lib="/c/Program Files (x86)/Windows Kits/10/Lib"
          sdk=$(ls -d "$sdk_lib"/[0-9]*.[0-9]*.[0-9]*.[0-9]*/ 2>/dev/null | sort -V | tail -n1)

          if [ -z "$sdk" ] || [ ! -f "${sdk}um/arm64/kernel32.lib" ]; then
            echo "No ARM64 kernel32.lib found in any SDK version under $sdk_lib"
            ls "$sdk_lib"
            exit 1
          fi

          echo "Using SDK ${sdk}"
          cp "${sdk}um/arm64/kernel32.lib" "$out/kernel32.lib"

      - name: Verify outputs
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/windows_arm64
          archives=$(find "$out" -maxdepth 1 -name '*.a' 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "No archives found in $out"
            ls -la "$out" || true
            exit 1
          fi

      - name: Write versions
        run: |
          bin=src/internal/llvm/toolchain/bin/windows_arm64
          lld=$("$bin/lld-link.exe" --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)
          printf '{"lld":"%s"}\n' "$lld" > "$bin/versions.json"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-tools
          if-no-files-found: error
          path: |
            src/internal/llvm/toolchain/bin/windows_arm64/
            src/internal/llvm/toolchain/lib/windows_arm64/
            src/internal/llvm/toolchain/include/windows_arm64/

  commit:
    needs: [fetch-unix, fetch-windows-amd64, fetch-windows-arm64]
    runs-on: [self-hosted, lfs-home]
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1" # don't download the old binaries; the artifacts replace them
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for the no-ff merge
          ref: dev
          lfs: false

      - name: Configure Forgejo credentials for LFS
        run: |
          umask 077
          printf 'machine git.isaksweb.xyz\nlogin %s\npassword %s\n' \
            "${{ vars.FORGEJO_USER }}" "${{ secrets.FORGEJO_TOKEN }}" > "$HOME/.netrc"

      - name: Setup git
        run: |
          git config credential.helper "netrc -f ~/.netrc"
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git checkout -B chore/update-tools

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: musl-toolchain-linux_amd64
          path: musl-toolchain-linux_amd64

      - uses: actions/download-artifact@v6
        with:
          name: musl-toolchain-linux_arm64
          path: musl-toolchain-linux_arm64

      - name: Extract musl toolchains
        run: |
          mkdir -p toolchains/musl/linux_amd64
          tar -xzf musl-toolchain-linux_amd64/musl-toolchain.tar.gz -C toolchains/musl/linux_amd64

          mkdir -p toolchains/musl/linux_arm64
          tar -xzf musl-toolchain-linux_arm64/musl-toolchain.tar.gz -C toolchains/musl/linux_arm64

      - name: Commit updated tools
        run: |
          git checkout dev
          git pull --ff-only origin dev

          git add src/internal/llvm/toolchain/ toolchains/musl/

          if git diff --cached --quiet; then
            echo "No toolchain changes."
            exit 0
          fi

          git commit -m "chore(llvm): update toolchain to ${{ env.LLVM_VERSION }}"
          git push origin dev

      - name: Remove Forgejo credentials
        if: always()
        run: rm -f "$HOME/.netrc"
