name: Fetch Tools

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1,4"

jobs:
  fetch-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/linux_amd64

      - name: Get LLVM version
        id: llvm-version
        run: |
          LLVM_VERSION=$(curl -s https://api.github.com/repos/llvm/llvm-project/releases/latest | grep -oE '"tag_name": "llvmorg-[^"]+' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "version=$LLVM_VERSION" >> $GITHUB_OUTPUT

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-source-linux-${{ steps.llvm-version.outputs.version }}

      - name: Clone LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch llvmorg-${{ steps.llvm-version.outputs.version }} https://github.com/llvm/llvm-project.git

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ zlib1g-dev

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v4
        with:
          path: llvm-project/build
          key: llvm-build-linux-amd64-${{ steps.llvm-version.outputs.version }}

      - name: Build llc, opt, and lld statically
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          ninja -C build llc opt lld

      - name: Prepare binaries
        run: |
          mkdir -p src/internal/llvm/toolchain/bin/linux_amd64
          cp llvm-project/build/bin/llc src/internal/llvm/toolchain/bin/linux_amd64/llc
          cp llvm-project/build/bin/opt src/internal/llvm/toolchain/bin/linux_amd64/opt
          cp llvm-project/build/bin/ld.lld src/internal/llvm/toolchain/bin/linux_amd64/ld.lld
          chmod +x src/internal/llvm/toolchain/bin/linux_amd64/*

      - name: Write versions
        run: |
          LLC_VERSION=$(src/internal/llvm/toolchain/bin/linux_amd64/llc --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          LLD_VERSION=$(src/internal/llvm/toolchain/bin/linux_amd64/ld.lld --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          OPT_VERSION=$(src/internal/llvm/toolchain/bin/linux_amd64/opt --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "{\"llc\": \"$LLC_VERSION\", \"lld\": \"$LLD_VERSION\", \"opt\": \"$OPT_VERSION\"}" > src/internal/llvm/toolchain/bin/linux_amd64/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/bin/linux_amd64/

  fetch-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/darwin_arm64

      - name: Get LLVM version
        id: llvm-version
        run: |
          set -e
          # Fetch the latest release and extract version
          RESPONSE=$(curl -s https://api.github.com/repos/llvm/llvm-project/releases/latest)
          LLVM_VERSION=$(echo "$RESPONSE" | grep -oP '"tag_name": "llvmorg-\K[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)

          # Fallback: if grep fails, try jq
          if [ -z "$LLVM_VERSION" ]; then
            if command -v jq &> /dev/null; then
              LLVM_VERSION=$(echo "$RESPONSE" | jq -r '.tag_name' | sed 's/llvmorg-//')
            else
              echo "Error: Could not determine LLVM version"
              exit 1
            fi
          fi

          echo "version=$LLVM_VERSION" >> $GITHUB_OUTPUT
          echo "Detected LLVM version: $LLVM_VERSION"

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-source-darwin-${{ steps.llvm-version.outputs.version }}

      - name: Clone LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch llvmorg-${{ steps.llvm-version.outputs.version }} https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v4
        with:
          path: llvm-project/build
          key: llvm-build-darwin-arm64-${{ steps.llvm-version.outputs.version }}

      - name: Build llc, opt, and lld statically
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          ninja -C build llc opt lld

      - name: Prepare binaries
        run: |
          mkdir -p src/internal/llvm/toolchain/bin/darwin_arm64
          cp llvm-project/build/bin/llc src/internal/llvm/toolchain/bin/darwin_arm64/llc
          cp llvm-project/build/bin/opt src/internal/llvm/toolchain/bin/darwin_arm64/opt
          cp llvm-project/build/bin/ld.lld src/internal/llvm/toolchain/bin/darwin_arm64/ld.lld
          chmod +x src/internal/llvm/toolchain/bin/darwin_arm64/*

      - name: Write versions
        run: |
          LLC_VERSION=$(src/internal/llvm/toolchain/bin/darwin_arm64/llc --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          LLD_VERSION=$(src/internal/llvm/toolchain/bin/darwin_arm64/ld.lld --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          OPT_VERSION=$(src/internal/llvm/toolchain/bin/darwin_arm64/opt --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "{\"llc\": \"$LLC_VERSION\", \"lld\": \"$LLD_VERSION\", \"opt\": \"$OPT_VERSION\"}" > src/internal/llvm/toolchain/bin/darwin_arm64/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/bin/darwin_arm64/

  fetch-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src/internal/llvm/toolchain/bin/windows_amd64

      - name: Setup msys2 and install llvm
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >
            git
            cmake
            ninja
            clang
            python3
            llvm

      - name: Get LLVM version
        id: llvm-version
        shell: msys2 {0}
        run: |
          LLVM_VERSION=$(llvm-config --version)
          echo "version=$LLVM_VERSION" >> $GITHUB_OUTPUT

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-source-windows-${{ steps.llvm-version.outputs.version }}

      - name: Clone LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch llvmorg-${{ steps.llvm-version.outputs.version }} https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v4
        with:
          path: llvm-project/build
          key: llvm-build-windows-amd64-${{ steps.llvm-version.outputs.version }}

      - name: Build llc and lld statically
        shell: msys2 {0}
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_ASM_COMPILER=clang \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja -C build llc opt lld
          mkdir -p ../src/internal/llvm/toolchain/bin/windows_amd64
          cp build/bin/llc.exe ../src/internal/llvm/toolchain/bin/windows_amd64/llc.exe
          cp build/bin/lld-link.exe ../src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe
          cp build/bin/opt.exe ../src/internal/llvm/toolchain/bin/windows_amd64/opt.exe
          chmod +x ../src/internal/llvm/toolchain/bin/windows_amd64/llc.exe
          chmod +x ../src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe
          chmod +x ../src/internal/llvm/toolchain/bin/windows_amd64/opt.exe

      - name: Copy kernel32.lib
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" | Sort-Object Name -Descending | Select-Object -First 1
          $lib = "$($sdk.FullName)\um\x64\kernel32.lib"
          cp $lib src/internal/llvm/toolchain/bin/windows_amd64/kernel32.lib

      - name: Write versions
        shell: msys2 {0}
        run: |
          LLC_VERSION=$(src/internal/llvm/toolchain/bin/windows_amd64/llc.exe --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          LLD_VERSION=$(src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          OPT_VERSION=$(src/internal/llvm/toolchain/bin/windows_amd64/opt.exe --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          echo "{\"llc\": \"$LLC_VERSION\", \"lld\": \"$LLD_VERSION\", \"opt\": \"$OPT_VERSION\"}" > src/internal/llvm/toolchain/bin/windows_amd64/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/bin/windows_amd64/

  commit:
    needs: [fetch-linux-amd64, fetch-darwin-arm64, fetch-windows-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup git
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git checkout -b chore/update-tools

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/bin/linux_amd64/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/bin/darwin_arm64/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/bin/windows_amd64/

      - name: Commit binaries
        run: |
          set -e
          git add src/internal/llvm/toolchain/bin/
          if git diff --staged --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tools"
          fi

          git checkout master
          git pull --no-rebase origin master
          git merge --no-ff chore/update-tools
          git push origin master
