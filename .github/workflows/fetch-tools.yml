name: Fetch Tools

on:
  workflow_dispatch:

env:
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://100.125.229.8:3900
  SCCACHE_REGION: garage
  SCCACHE_S3_USE_SSL: "off"
  AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_KEY }}
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  LLVM_VERSION: "20.1.8"

jobs:
  fetch-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            musl_target: x86_64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-amd64-tools
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            musl_target: aarch64-linux-musl
            lld_binary: ld.lld
            artifact_name: linux-arm64-tools
          - os: macos-15
            platform: darwin_arm64
            lld_binary: ld64.lld
            artifact_name: darwin-arm64-tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: |
          rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/lib/${{ matrix.platform }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            xz-utils \
            patch \
            perl \
            zlib1g-dev

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Start sccache
        run: sccache --start-server

      - name: Clone musl-cross-make (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 \
            --branch v0.9.11 \
            https://github.com/richfelker/musl-cross-make.git

      - name: Copy GNU config.sub (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p musl-cross-make/sources

          cp ci/vendor/gnu/config.sub musl-cross-make/sources/config.sub

      - name: Configure musl-cross-make for static builds (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cat > musl-cross-make/config.mak <<'EOF'
          COMMON_CONFIG += CFLAGS="-g0 -O2" CXXFLAGS="-g0 -O2" LDFLAGS="-s -static --static"
          COMMON_CONFIG += CC="sccache gcc" CXX="sccache g++"
          EOF

      - name: Build musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          make -C musl-cross-make \
            TARGET="${{ matrix.musl_target }}" \
            OUTPUT="$RUNNER_TEMP/musl-toolchain" \
            -j"$(nproc)" \
            install

          TOOLCHAIN="$RUNNER_TEMP/musl-toolchain/bin"

          "$TOOLCHAIN/${{ matrix.musl_target }}-gcc" --version
          "$TOOLCHAIN/${{ matrix.musl_target }}-g++" --version

          echo "MUSL_CC=$TOOLCHAIN/${{ matrix.musl_target }}-gcc" >> "$GITHUB_ENV"
          echo "MUSL_CXX=$TOOLCHAIN/${{ matrix.musl_target }}-g++" >> "$GITHUB_ENV"

      - name: Generate musl toolchain metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TARGET="${{ matrix.musl_target }}"
          TOOLCHAIN="$RUNNER_TEMP/musl-toolchain/bin"

          # Read the effective versions from musl-cross-make.
          mapfile -t VERSIONS < <(
            make -s -C musl-cross-make \
              TARGET="$TARGET" \
              --eval='print-versions:;@printf "%s\n" "$(GCC_VER)" "$(MUSL_VER)" "$(BINUTILS_VER)" "$(GMP_VER)" "$(MPC_VER)" "$(MPFR_VER)" "$(ISL_VER)" "$(LINUX_VER)"' \
              print-versions
          )

          GCC_VER="${VERSIONS[0]}"
          MUSL_VER="${VERSIONS[1]}"
          BINUTILS_VER="${VERSIONS[2]}"
          GMP_VER="${VERSIONS[3]}"
          MPC_VER="${VERSIONS[4]}"
          MPFR_VER="${VERSIONS[5]}"
          ISL_VER="${VERSIONS[6]}"
          LINUX_VER="${VERSIONS[7]}"

          GCC_ACTUAL=$("$TOOLCHAIN/$TARGET-gcc" -dumpfullversion -dumpversion)
          BUILD_COMMIT=$(git -C musl-cross-make rev-parse HEAD)

          cat > "$RUNNER_TEMP/musl-toolchain/versions.json" <<EOF
          {
            "schema_version": 1,
            "target": "$TARGET",
            "builder": {
              "name": "musl-cross-make",
              "commit": "$BUILD_COMMIT"
            },
            "components": {
              "gcc": "$GCC_VER",
              "gcc_reported": "$GCC_ACTUAL",
              "musl": "$MUSL_VER",
              "binutils": "$BINUTILS_VER",
              "gmp": "$GMP_VER",
              "mpc": "$MPC_VER",
              "mpfr": "$MPFR_VER",
              "isl": "$ISL_VER",
              "linux_headers": "$LINUX_VER"
            }
          }
          EOF

          cat "$RUNNER_TEMP/musl-toolchain/versions.json"

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "toolchains/musl/${{ matrix.platform }}"
          cp -a "$RUNNER_TEMP/musl-toolchain/." \
            "toolchains/musl/${{ matrix.platform }}/"

      - name: Package musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf musl-toolchain.tar.gz \
            -C "$RUNNER_TEMP/musl-toolchain" .

      - name: Upload musl toolchain (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: musl-toolchain-${{ matrix.platform }}
          path: musl-toolchain.tar.gz

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Get LLVM version
        id: llvm-version
        run: |
          echo "version=${{ env.LLVM_VERSION }}" >> $GITHUB_OUTPUT

      - name: Clone LLVM
        run: |
          git clone --depth 1 \
            --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
            https://github.com/llvm/llvm-project.git

      - name: Build LLVM libraries and lld (Linux)
        if: runner.os == 'Linux'
        run: |
          cd llvm-project

          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER="$MUSL_CC" \
            -DCMAKE_CXX_COMPILER="$MUSL_CXX" \
            -DLLVM_HOST_TRIPLE="${{ matrix.musl_target }}" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections"

          ninja -C build LLVMExecutionEngine LLVMInterpreter LLVMRuntimeDyld LLVMMCJIT \
            clang-libraries

      - name: Build LLVM libraries and lld (macOS)
        if: runner.os == 'macOS'
        run: |
          cd llvm-project
          # -DCMAKE_EXE_LINKER_FLAGS="-static" is intentionally omitted:
          # Apple does not ship static versions of system libraries, so
          # requesting a fully static link fails on Darwin. LLVM_BUILD_STATIC
          # still statically links LLVM's own internals.
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections"

          ninja -C build LLVMExecutionEngine LLVMInterpreter LLVMMCJIT \
            clang-libraries

      - name: Copy headers
        run: |
          OUT="src/internal/llvm/toolchain"
          PLATFORM="${{ matrix.platform }}"

          mkdir -p "$OUT/include/$PLATFORM/llvm" \
                  "$OUT/include/$PLATFORM/llvm-c" \
                  "$OUT/include/$PLATFORM/lld" \
                  "$OUT/include/$PLATFORM/clang-c"

          cp -R llvm-project/llvm/include/llvm/. \
            "$OUT/include/$PLATFORM/llvm/"
          cp -R llvm-project/llvm/include/llvm-c/. \
            "$OUT/include/$PLATFORM/llvm-c/"
          cp -R llvm-project/lld/include/lld/. \
            "$OUT/include/$PLATFORM/lld/"
          cp -R llvm-project/clang/include/clang-c/. \
            "$OUT/include/$PLATFORM/clang-c/"

          for flavor in ELF COFF MachO; do
            mkdir -p "$OUT/include/$PLATFORM/lld/$flavor"
            cp -R "llvm-project/lld/$flavor/." \
              "$OUT/include/$PLATFORM/lld/$flavor/"
          done

          # Include generated config headers, if present.
          if [ -d llvm-project/build/include/llvm ]; then
            cp -R llvm-project/build/include/llvm/. \
              "$OUT/include/$PLATFORM/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for lib in llvm-project/build/lib/*.a; do
            cp "$lib" "$OUT/"
          done

      - name: Copy musl libc + CRT (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          OUT="src/internal/llvm/toolchain/libc/${{ matrix.platform }}"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # musl-cross-make installs to $RUNNER_TEMP/musl-toolchain/<target>/lib
          MUSL_LIB="$RUNNER_TEMP/musl-toolchain/${{ matrix.musl_target }}/lib"

          # These are the files Wick needs to link against at compile time
          cp "$MUSL_LIB/crt1.o" "$OUT/"
          cp "$MUSL_LIB/crti.o" "$OUT/"
          cp "$MUSL_LIB/crtn.o" "$OUT/"
          cp "$MUSL_LIB/libc.a" "$OUT/"
          cp "$MUSL_LIB/libm.a" "$OUT/"
          # also useful later, not required for mini.wk:
          cp "$MUSL_LIB/crtbegin.o" "$OUT/" || true
          cp "$MUSL_LIB/crtend.o" "$OUT/" || true

          ls -lh "$OUT/"

      - name: Copy libSystem.tbd (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          SDK=$(xcrun --show-sdk-path)
          echo "SDK: $SDK"

          # The SDK .tbd is universal - it has both x86_64-macos and arm64-macos
          # targets in one file, so we copy the same file to both folders.
          for PLAT in darwin_arm64 darwin_amd64; do
            OUT="src/internal/llvm/toolchain/libc/$PLAT"
            rm -rf "$OUT"
            mkdir -p "$OUT"
            cp "$SDK/usr/lib/libSystem.tbd" "$OUT/"
            cp "$SDK/usr/lib/libSystem.B.tbd" "$OUT/" || true
            echo "--- $PLAT ---"
            ls -lh "$OUT/"
            grep -m1 "targets:" "$OUT/libSystem.tbd" || true
          done

      - name: Verify outputs
        run: |
          set -euo pipefail
          OUT=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          test -n "$(ls "$OUT"/*.a 2>/dev/null)" || { echo "No archives copied"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src/internal/llvm/toolchain/lib/${{ matrix.platform }}/
            src/internal/llvm/toolchain/libc/${{ matrix.platform }}/
            src/internal/llvm/toolchain/include/${{ matrix.platform }}/
            src/internal/llvm/toolchain/libc/darwin_amd64/
            src/internal/llvm/toolchain/libc/darwin_arm64/
            src/internal/llvm/toolchain/bin/${{ matrix.platform }}/

  fetch-windows:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows_amd64
            msystem: CLANG64
            mingw_prefix: clang64
            mingw_target: x86_64-w64-mingw32
            sdk_arch: x64
            artifact_name: windows-amd64-tools
            msys_packages: >-
              git
              mingw-w64-clang-x86_64-gcc
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
              mingw-w64-clang-x86_64-binutils
              mingw-w64-clang-x86_64-python
              mingw-w64-clang-x86_64-sccache
              mingw-w64-clang-x86_64-crt-git
              mingw-w64-clang-x86_64-headers-git
          - os: windows-11-arm
            platform: windows_arm64
            msystem: CLANGARM64
            mingw_prefix: clangarm64
            mingw_target: aarch64-w64-mingw32
            sdk_arch: arm64
            artifact_name: windows-arm64-tools
            msys_packages: >-
              git
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-binutils
              mingw-w64-clang-aarch64-python
              mingw-w64-clang-aarch64-sccache
              mingw-w64-clang-aarch64-crt-git
              mingw-w64-clang-aarch64-headers-git
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys_packages }}

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Start sccache
        run: sccache --start-server

      - name: Cleanup
        run: |
          rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          rm -rf src/internal/llvm/toolchain/libc/${{ matrix.platform }}

      - name: Clone LLVM
        run: |
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git

      - name: Build LLVM libraries and lld
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLD_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--gc-sections"
          cmake --build llvm-project/build

      - name: Copy headers
        run: |
          root=src/internal/llvm/toolchain/include/${{ matrix.platform }}
          mkdir -p "$root/llvm" "$root/llvm-c" "$root/lld" "$root/clang-c"
          cp -r llvm-project/llvm/include/llvm/. "$root/llvm/"
          cp -r llvm-project/llvm/include/llvm-c/. "$root/llvm-c/"
          cp -r llvm-project/lld/include/lld/. "$root/lld/"
          cp -r llvm-project/clang/include/clang-c/. "$root/clang-c/"
          for flavor in ELF COFF MachO; do
            mkdir -p "$root/lld/$flavor"
            cp -R "llvm-project/lld/$flavor/." "$root/lld/$flavor/"
          done
          if [ -d llvm-project/build/include/llvm ]; then
            cp -r llvm-project/build/include/llvm/. "$root/llvm/"
          fi

      - name: Copy static LLVM libraries
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          rm -rf "$out"
          mkdir -p "$out"
          shopt -s nullglob
          libs=(llvm-project/build/lib/*.a)
          echo "Found ${#libs[@]} archives in llvm-project/build/lib"
          if [ "${#libs[@]}" -eq 0 ]; then
            ls -la llvm-project/build/lib || true
            exit 1
          fi
          copied=0
          for lib in "${libs[@]}"; do
            case "$lib" in *.dll.a) continue ;; esac
            cp "$lib" "$out/"
            copied=$((copied + 1))
          done
          echo "Copied $copied archives into $out"

      - name: Copy mingw CRT
        run: |
          set -euo pipefail
          case "$MSYSTEM" in
            CLANG64) PREFIX=/clang64; TRIPLE=x86_64; ;;
            CLANGARM64) PREFIX=/clangarm64; TRIPLE=aarch64; ;;
            *) echo "unsupported MSYSTEM: $MSYSTEM" >&2; exit 1 ;;
          esac

          out="src/internal/llvm/toolchain/libc/windows_${TS_ARCH}"
          mkdir -p "$out"

          for f in crt2.o crtend.o libmingw32.a libmingwex.a libmsvcrt.a libucrt.a libkernel32.a; do
            src="$(find "$PREFIX" -name "$f" -print -quit 2>/dev/null || true)"
            if [ -n "$src" ]; then
              echo "Copy $f from $src"
              cp "$src" "$out/"
            else
              echo "ERROR: $f not found under $PREFIX" >&2; exit 1
            fi
          done

          for f in crtexe.o; do
            src="$(find "$PREFIX" -name "$f" -print -quit 2>/dev/null || true)"
            if [ -n "$src" ]; then
              cp "$src" "$out/"
            else
              echo "note: $f not present in MSYS2 (merged into crt2.o), skipping"
            fi
          done

          # libgcc.a or compiler-rt fallback
          libgcc="$(find "$PREFIX" -name "libgcc.a" -print -quit 2>/dev/null || true)"
          if [ -n "$libgcc" ]; then
            cp "$libgcc" "$out/libgcc.a"
          else
            builtins="$(find "$PREFIX/lib/clang" -name "libclang_rt.builtins-${TRIPLE}.a" -print -quit 2>/dev/null || true)"
            if [ -n "$builtins" ]; then
              cp "$builtins" "$out/libgcc.a"
            else
              echo "ERROR: no libgcc / builtins found" >&2; exit 1
            fi
          fi

          ls -lh "$out/"

      - name: Verify outputs
        run: |
          set -euo pipefail
          out=src/internal/llvm/toolchain/lib/${{ matrix.platform }}
          archives=$(find "$out" -maxdepth 1 -name '*.a' 2>/dev/null || true)
          if [ -z "$archives" ]; then
            echo "No archives found in $out"
            ls -la "$out" || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src/internal/llvm/toolchain/libc/${{ matrix.platform }}/
            src/internal/llvm/toolchain/lib/${{ matrix.platform }}/
            src/internal/llvm/toolchain/include/${{ matrix.platform }}/

  commit:
    needs: [fetch-unix, fetch-windows]
    runs-on: [self-hosted, lfs-home]
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1" # don't download the old binaries; the artifacts replace them
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for the no-ff merge
          ref: ${{ github.ref_name }}
          lfs: false

      - name: Configure Forgejo credentials for LFS
        run: |
          umask 077
          printf 'machine git.isaksweb.xyz\nlogin %s\npassword %s\n' \
            "${{ vars.FORGEJO_USER }}" "${{ secrets.FORGEJO_TOKEN }}" > "$HOME/.netrc"

      - name: Setup git
        run: |
          git config credential.helper "netrc -f ~/.netrc"
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: windows-arm64-tools
          path: src/internal/llvm/toolchain/

      - uses: actions/download-artifact@v6
        with:
          name: musl-toolchain-linux_amd64
          path: musl-toolchain-linux_amd64

      - uses: actions/download-artifact@v6
        with:
          name: musl-toolchain-linux_arm64
          path: musl-toolchain-linux_arm64

      - name: Extract musl toolchains
        run: |
          mkdir -p toolchains/musl/linux_amd64
          tar -xzf musl-toolchain-linux_amd64/musl-toolchain.tar.gz -C toolchains/musl/linux_amd64

          mkdir -p toolchains/musl/linux_arm64
          tar -xzf musl-toolchain-linux_arm64/musl-toolchain.tar.gz -C toolchains/musl/linux_arm64

      - name: Commit updated tools
        run: |
          git pull --ff-only origin ${{ github.ref_name }}

          git add src/internal/llvm/toolchain/ toolchains/musl/

          if git diff --cached --quiet; then
            echo "No toolchain changes."
            exit 0
          fi

          git commit -m "chore(llvm): update toolchain to ${{ env.LLVM_VERSION }}"
          git push origin ${{ github.ref_name }}

      - name: Remove Forgejo credentials
        if: always()
        run: rm -f "$HOME/.netrc"
