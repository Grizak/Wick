name: Fetch Tools

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1,4"

concurrency:
  group: fetch-tools
  cancel-in-progress: true

jobs:
  fetch-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
            lld_binary: ld.lld
            artifact_name: linux-amd64-tools
          - os: macos-15
            platform: darwin_arm64
            lld_binary: ld64.lld
            artifact_name: darwin-arm64-tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: rm -rf src/internal/llvm/toolchain/bin/${{ matrix.platform }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Get LLVM version
        id: llvm-version
        run: |
          LLVM_VERSION=$(
            git ls-remote --tags --refs https://github.com/llvm/llvm-project.git \
              | sed 's|.*refs/tags/llvmorg-||' \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V \
              | tail -1
          )

          echo "version=$LLVM_VERSION" >> $GITHUB_OUTPUT

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: llvm-project
          key: llvm-source-${{ matrix.platform }}-${{ steps.llvm-version.outputs.version }}

      - name: Re-clone if cache is invalid
        run: |
          if [ ! -f llvm-project/llvm/CMakeLists.txt ]; then
            rm -rf llvm-project

            git clone --depth 1 \
              --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
              https://github.com/llvm/llvm-project.git
          fi

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-${{ matrix.platform }}-${{ steps.llvm-version.outputs.version }}

      - name: Build llc, opt, and lld (Linux)
        if: runner.os == 'Linux'
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          ninja -C build llc opt lld

      - name: Build llc, opt, and lld (macOS)
        if: runner.os == 'macOS'
        run: |
          cd llvm-project
          # -DCMAKE_EXE_LINKER_FLAGS="-static" is intentionally omitted:
          # Apple does not ship static versions of system libraries, so
          # requesting a fully static link fails on Darwin. LLVM_BUILD_STATIC
          # still statically links LLVM's own internals.
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja -C build llc opt lld

      - name: Verify macOS binaries
        if: runner.os == 'macOS'
        run: |
          test -f llvm-project/build/bin/llc
          test -f llvm-project/build/bin/opt
          test -f llvm-project/build/bin/ld64.lld

      - name: Prepare binaries
        run: |
          mkdir -p src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          cp llvm-project/build/bin/llc  src/internal/llvm/toolchain/bin/${{ matrix.platform }}/llc
          cp llvm-project/build/bin/opt  src/internal/llvm/toolchain/bin/${{ matrix.platform }}/opt
          cp llvm-project/build/bin/${{ matrix.lld_binary }} \
             src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}
          chmod +x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/*

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          strip src/internal/llvm/toolchain/bin/${{ matrix.platform }}/llc
          strip src/internal/llvm/toolchain/bin/${{ matrix.platform }}/opt
          strip src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          strip -x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/llc
          strip -x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/opt
          strip -x src/internal/llvm/toolchain/bin/${{ matrix.platform }}/${{ matrix.lld_binary }}

      - name: Write versions
        run: |
          BIN=src/internal/llvm/toolchain/bin/${{ matrix.platform }}
          LLC_VERSION=$($BIN/llc --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          LLD_VERSION=$($BIN/${{ matrix.lld_binary }} --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          OPT_VERSION=$($BIN/opt --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "{\"llc\": \"$LLC_VERSION\", \"lld\": \"$LLD_VERSION\", \"opt\": \"$OPT_VERSION\"}" \
            > $BIN/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: src/internal/llvm/toolchain/bin/${{ matrix.platform }}/

  fetch-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cleanup
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src/internal/llvm/toolchain/bin/windows_amd64

      - name: Setup MSYS2 and install LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >
            git
            cmake
            ninja
            clang
            python3
            llvm

      - name: Get LLVM version
        id: llvm-version
        shell: msys2 {0}
        run: |
          LLVM_VERSION=$(llvm-config --version | head -1)
          echo "version=$LLVM_VERSION" >> $GITHUB_OUTPUT

      - name: Cache LLVM source
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: llvm-project
          key: llvm-source-windows-${{ steps.llvm-version.outputs.version }}

      - name: Clone LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch llvmorg-${{ steps.llvm-version.outputs.version }} \
            https://github.com/llvm/llvm-project.git

      - name: Cache LLVM build
        id: cache-llvm-build
        uses: actions/cache@v5
        with:
          path: llvm-project/build
          key: llvm-build-windows-amd64-${{ steps.llvm-version.outputs.version }}

      - name: Build llc, opt, and lld
        shell: msys2 {0}
        run: |
          cd llvm-project
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_ASM_COMPILER=clang \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="lld" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja -C build llc opt lld
          mkdir -p ../src/internal/llvm/toolchain/bin/windows_amd64
          cp build/bin/llc.exe      ../src/internal/llvm/toolchain/bin/windows_amd64/llc.exe
          cp build/bin/lld-link.exe ../src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe
          cp build/bin/opt.exe      ../src/internal/llvm/toolchain/bin/windows_amd64/opt.exe

      - name: Copy kernel32.lib
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $lib = "$($sdk.FullName)\um\x64\kernel32.lib"
          cp $lib src/internal/llvm/toolchain/bin/windows_amd64/kernel32.lib

      - name: Strip binaries (Windows)
        shell: msys2 {0}
        run: |
          llvm-strip src/internal/llvm/toolchain/bin/windows_amd64/llc.exe
          llvm-strip src/internal/llvm/toolchain/bin/windows_amd64/opt.exe
          llvm-strip src/internal/llvm/toolchain/bin/windows_amd64/lld-link.exe

      - name: Write versions
        shell: msys2 {0}
        run: |
          BIN=src/internal/llvm/toolchain/bin/windows_amd64
          LLC_VERSION=$($BIN/llc.exe --version      | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          LLD_VERSION=$($BIN/lld-link.exe --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          OPT_VERSION=$($BIN/opt.exe --version      | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "{\"llc\": \"$LLC_VERSION\", \"lld\": \"$LLD_VERSION\", \"opt\": \"$OPT_VERSION\"}" \
            > $BIN/versions.json

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/bin/windows_amd64/

  commit:
    needs: [fetch-unix, fetch-windows-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history needed for the no-ff merge

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git checkout -B chore/update-tools  # -B resets the branch if it already exists

      - uses: actions/download-artifact@v6
        with:
          name: linux-amd64-tools
          path: src/internal/llvm/toolchain/bin/linux_amd64/

      - uses: actions/download-artifact@v6
        with:
          name: darwin-arm64-tools
          path: src/internal/llvm/toolchain/bin/darwin_arm64/

      - uses: actions/download-artifact@v6
        with:
          name: windows-amd64-tools
          path: src/internal/llvm/toolchain/bin/windows_amd64/

      - name: Commit and push
        run: |
          set -e
          git add src/internal/llvm/toolchain/bin/
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi
          git commit -m "chore: update tools"
          git checkout master
          git pull --no-rebase origin master
          git merge --no-ff chore/update-tools
          git push origin master
