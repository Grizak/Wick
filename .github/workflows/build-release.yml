name: Build & Release Wick
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-aarch64-linux-gnu
      - name: Build Linux release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Linux snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        run: |
          mkdir -p release-assets repo-packages
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} release-assets/ \;
          find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} repo-packages/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-linux
          path: release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: repo-packages/

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            msvc_arch: amd64
          - arch: arm64
            msvc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare build assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src\internal\assets | Out-Null
          Copy-Item LICENSE src\internal\assets\LICENSE -Force
          go mod tidy
      - name: Configure Visual Studio toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Clang
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.windows-${{ matrix.arch }}.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Windows snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.windows-${{ matrix.arch }}.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\*.zip release-assets\ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-windows-${{ matrix.arch }}
          path: release-assets\

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Darwin release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Darwin snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-darwin
          path: release-assets/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-darwin]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-release-*
          path: dist/
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  publish-repo:
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - uses: Grizak/packages/.github/actions/publish@v2
        with:
          build-command: ":" # No-op
          build-dir: dist
          token: ${{ secrets.RELEASE_TOKEN }}
