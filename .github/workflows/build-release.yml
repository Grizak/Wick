name: Build & Release Wick
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install llvm
        run: |
          set -e
          apt-get update
          apt-get install llvm

      - name: Build
        run: |
          set -e
          make all \
           DARWIN_TARGET=wick-darwin_arm64-${GITHUB_REF_NAME} \
           WIN_TARGET=wick-windows_amd64-${GITHUB_REF_NAME} \
           LINUX_TARGET=wick-linux_amd64-${GITHUB_REF_NAME} 

      - name: Strip binaries
        run: |
          set -e
          llvm-strip build/wick-*

      - uses: actions/upload-artifact@v6
        with:
          name: build-produce
          path: build/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: build-produce
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/*
