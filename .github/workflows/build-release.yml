name: Build & Release Wick
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull --include="src/internal/llvm/toolchain/bin/linux_amd64/*,src/internal/llvm/toolchain/bin/linux_arm64/*,src/internal/llvm/toolchain/lib/linux_amd64/*,src/internal/llvm/toolchain/lib/linux_arm64/*"
      - name: Export LLVM link flags
        shell: bash
        run: |
          echo "LLVM_LDFLAGS_LINUX_AMD64=$(scripts/llvm-ldflags.sh linux_amd64)" >> "$GITHUB_ENV"
          echo "LLVM_LDFLAGS_LINUX_ARM64=$(scripts/llvm-ldflags.sh linux_arm64)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-aarch64-linux-gnu
      - name: Prepare build assets
        shell: bash
        run: |
          mkdir -p src/internal/assets/changelog
          cp LICENSE src/internal/assets/LICENSE
          cp release-notes/*.md src/internal/assets/changelog/
      - name: Build Linux release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Linux snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Report dynamic dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for bin in $(find dist -type f -name wick); do
            echo "== $bin"
            READELF=readelf; OBJDUMP=objdump
            if [[ "$bin" == *arm64* ]]; then
              READELF=aarch64-linux-gnu-readelf
              OBJDUMP=aarch64-linux-gnu-objdump
            fi
            $READELF -d "$bin" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            echo "max GLIBC symbol version:"
            $OBJDUMP -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true
          done
      - name: Stage release assets
        run: |
          mkdir -p release-assets repo-packages
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} release-assets/ \;
          find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} repo-packages/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-linux
          path: release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: repo-packages/

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull --include="src/internal/llvm/toolchain/bin/windows_amd64/*,src/internal/llvm/toolchain/lib/windows_amd64/*"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
      - name: Export LLVM link flags
        shell: bash
        run: |
          echo "LLVM_LDFLAGS_WINDOWS_AMD64=$(scripts/llvm-ldflags.sh windows_amd64)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare build assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src\internal\assets\changelog | Out-Null
          Copy-Item LICENSE src\internal\assets\LICENSE -Force
          Copy-Item release-notes\*.md src\internal\assets\changelog\ -Force

      - name: Build Windows release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.windows-amd64.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Windows snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.windows-amd64.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Report DLL dependencies
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Filter wick.exe | ForEach-Object {
            Write-Host "== $($_.FullName)"
            objdump -p $_.FullName | Select-String 'DLL Name'
          }
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\*.zip release-assets\ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-windows-amd64
          path: release-assets\

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull --include="src/internal/llvm/toolchain/bin/windows_arm64/*,src/internal/llvm/toolchain/lib/windows_arm64/*"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-clang
      - name: Put CLANGARM64 on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin"
      - name: Export LLVM link flags
        shell: bash
        run: |
          echo "LLVM_LDFLAGS_WINDOWS_ARM64=$(scripts/llvm-ldflags.sh windows_arm64)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare build assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src\internal\assets\changelog | Out-Null
          Copy-Item LICENSE src\internal\assets\LICENSE -Force
          Copy-Item release-notes\*.md src\internal\assets\changelog\ -Force

      - name: Build Windows release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.windows-arm64.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Windows snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.windows-arm64.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Report DLL dependencies
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Filter wick.exe | ForEach-Object {
            Write-Host "== $($_.FullName)"
            llvm-objdump -p $_.FullName | Select-String 'DLL Name'
          }
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\*.zip release-assets\ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-windows-arm64
          path: release-assets\

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Pull LFS objects from Forgejo
        run: git lfs pull --include="src/internal/llvm/toolchain/bin/darwin_arm64/*,src/internal/llvm/toolchain/lib/darwin_arm64/*"
      - name: Export LLVM link flags
        shell: bash
        run: |
          echo "LLVM_LDFLAGS_DARWIN_ARM64=$(scripts/llvm-ldflags.sh darwin_arm64)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare build assets
        shell: bash
        run: |
          mkdir -p src/internal/assets/changelog
          cp LICENSE src/internal/assets/LICENSE
          cp release-notes/*.md src/internal/assets/changelog/
      - name: Build Darwin release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Darwin snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Report linked libraries
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for bin in $(find dist -type f -name wick); do
            echo "== $bin"
            otool -L "$bin" || echo "::warning::otool failed on $bin"
            # Fail if anything points at Homebrew or other non-system paths
            if otool -L "$bin" | grep -E '/opt/homebrew|/usr/local/'; then
              echo "::warning::non-system dependency found in $bin"
            fi
          done
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-darwin
          path: release-assets/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-amd64, build-windows-arm64, build-darwin]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-release-*
          path: dist/
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Generate release notes
        run: |
          scripts/split-changelog.sh
          test -f "release-notes/${GITHUB_REF_NAME}.md" || {
            echo "No changelog section for ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md"

  publish-repo:
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - uses: Grizak/packages/.github/actions/publish@v2
        with:
          build-command: ":" # No-op
          build-dir: dist
          token: ${{ secrets.RELEASE_TOKEN }}
