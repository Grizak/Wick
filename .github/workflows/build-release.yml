name: Build & Release Wick
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-aarch64-linux-gnu
      - name: Build Linux release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Linux snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.linux.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        run: |
          mkdir -p release-assets repo-packages
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} release-assets/ \;
          find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} repo-packages/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-linux
          path: release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: repo-packages/

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Configure Windows cross-compilers
        run: |
          mkdir -p /tmp/zig-wrappers
          cat > /tmp/zig-wrappers/x86_64-windows-gnu-cc <<'EOF'
          #!/bin/sh
          exec zig cc -target x86_64-windows-gnu "$@"
          EOF
          cat > /tmp/zig-wrappers/x86_64-windows-gnu-c++ <<'EOF'
          #!/bin/sh
          exec zig c++ -target x86_64-windows-gnu -stdlib=libstdc++ "$@"
          EOF
          cat > /tmp/zig-wrappers/aarch64-windows-gnu-cc <<'EOF'
          #!/bin/sh
          exec zig cc -target aarch64-windows-gnu "$@"
          EOF
          cat > /tmp/zig-wrappers/aarch64-windows-gnu-c++ <<'EOF'
          #!/bin/sh
          exec zig c++ -target aarch64-windows-gnu -stdlib=libstdc++ "$@"
          EOF
          chmod +x /tmp/zig-wrappers/*
      - name: Build Windows release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.windows.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Windows snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.windows.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f -name '*.zip' -exec cp {} release-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-windows
          path: release-assets/

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Darwin release
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type == 'tag'
        with:
          args: release --clean --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Build Darwin snapshot
        uses: goreleaser/goreleaser-action@v6
        if: github.ref_type != 'tag'
        with:
          args: release --clean --snapshot --skip=publish --config .goreleaser.darwin.yaml
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-darwin
          path: release-assets/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-darwin]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-release-*
          path: dist/
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  publish-repo:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      - uses: Grizak/packages/.github/actions/publish@v1
        with:
          build-command: ":" # No-op
          build-dir: dist
          token: ${{ secrets.RELEASE_TOKEN }}
