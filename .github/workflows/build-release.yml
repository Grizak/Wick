name: Build & Release Wick
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          set -e
          make linux TARGET=wick-linux_amd64-${GITHUB_REF_NAME}
          make win TARGET=wick-windows_amd64-${GITHUB_REF_NAME}
          make darwin TARGET=wick-darwin_arm64-${GITHUB_REF_NAME}

      - name: Strip binaries
        run: |
          set -e
          strip build/wick-linux_amd64-* build/wick-windows_amd64-*
          strip -x build/wick-darwin_arm64-*

      - uses: actions/upload-artifact@v6
        with:
          name: build-produce
          path: build/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: build-produce
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/*
