name: Build and publish Wick Website
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "release-notes/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: master
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: master/website/pnpm-lock.yaml

      - name: Serialise changes in the repo
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          path: master
          files_yaml: |
            website:
              - "website/**"
            changelog:
              - "release-notes/**"

      - name: Build website if needed
        if: steps.changes.outputs.website_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd master/website
          pnpm install --frozen-lockfile
          pnpm build
          cd "$GITHUB_WORKSPACE"
          cp -r master/website/dist/. site/

      - name: Update changelog if needed
        if: steps.changes.outputs.changelog_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p site/changelog
          cp master/release-notes/*.md site/changelog/
          ./master/scripts/update-changelog-index.sh site/changelog/ > site/changelog.index.json

      - name: Commit and push changes
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update website and changelog" || echo "No changes to commit"
          git push origin gh-pages
