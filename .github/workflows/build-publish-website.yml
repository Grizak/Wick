name: Build and publish Wick Website
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "release-notes/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: master
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Serialise changes in the repo
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          path: master
          files_yaml: |
            website:
              - "website/**"
            changelog:
              - "release-notes/**"

      - name: Build website if needed
        if: steps.changes.output.website_any_changed == 'true'
        run: |
          cd master/website
          pnpm install --frozen-lockfile
          pnpm build

          # Copy the built website to the site directory
          cp -r dist/* ../site/

      - name: Update changelog if needed
        if: steps.changes.output.changelog_any_changed == 'true'
        run: |
          cp master/release-notes/*.md site/changelog/
          ./master/scripts/update-changelog-index.sh site/changelog/ > site/changelog/index.md

      - name: Commit and push changes
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update website and changelog" || echo "No changes to commit"
          git push origin gh-pages
